name: Publish canonical MCP registry version

on:
  push:
    tags:
      - "policy-mcp-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable server.json version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  MCP_PUBLISHER_CERTIFICATE_IDENTITY: https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/v1.8.1
  MCP_PUBLISHER_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Confirm immutable version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          manifest_version=$(node -p "require('./server.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            requested_version="${GITHUB_REF_NAME#policy-mcp-v}"
          else
            requested_version="$REQUESTED_VERSION"
          fi
          if [ "$requested_version" != "$manifest_version" ]; then
            echo "Requested version $requested_version does not match server.json version $manifest_version."
            exit 1
          fi

      - name: Verify canonical MCP release
        run: |
          npm run test:policy-mcp
          npm run test:mcp-distribution
          npm run generate:policy-mcp-metadata
          git diff --exit-code -- server.json public/.well-known/mcp/server-card.json

      - name: Verify production is ready for publication
        env:
          MCP_INTERNAL_PROBE_TOKEN: ${{ secrets.MCP_INTERNAL_PROBE_TOKEN }}
        run: |
          node scripts/check-mcp-distribution.js --strict > mcp-distribution-health.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('mcp-distribution-health.json', 'utf8'));
          if (report.warnings.includes('live_tool_metadata_outdated')) {
            throw new Error('Production tool metadata is older than the release; deploy before publishing.');
          }
          NODE

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          bundle="${archive}.sigstore.json"
          release_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" "${release_url}/${archive}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$bundle" "${release_url}/${bundle}"

          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$MCP_PUBLISHER_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$MCP_PUBLISHER_CERTIFICATE_OIDC_ISSUER" \
            "$archive"

          tar -xzf "$archive" mcp-publisher
          ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish immutable registry version
        run: ./mcp-publisher publish

      - name: Verify published record
        run: |
          node - <<'NODE'
          (async () => {
            const manifest = require('./server.json');
            const endpoint = new URL('https://registry.modelcontextprotocol.io/v0.1/servers');
            endpoint.searchParams.set('search', manifest.name);
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const response = await fetch(endpoint);
              const payload = await response.json();
              const found = (payload.servers || []).some((entry) => {
                const server = entry.server || entry;
                return server.name === manifest.name && server.version === manifest.version;
              });
              if (found) return;
              if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            throw new Error(`Registry did not expose ${manifest.name}@${manifest.version} after publication.`);
          })().catch((error) => {
            console.error(error?.stack || error?.message || String(error));
            process.exit(1);
          });
          NODE
